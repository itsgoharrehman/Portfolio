<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- GOHAR SIGNATURE FAVICON -->
  <defs>
    <filter id="sig-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#C7FF4A" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark circular background with subtle neon rim -->
  <circle cx="64" cy="64" r="60" fill="#080808" stroke="#C7FF4A" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Handwritten Cursive Signature of "Gohar" -->
  <g filter="url(#sig-glow)">
    <!-- Elegant Capital 'G' loop & stem -->
    <path
      d="M82 28 C64 22, 38 28, 30 46 C22 64, 34 88, 56 86 C72 84, 82 70, 78 54 C74 42, 58 46, 52 56 C46 68, 54 86, 68 88"
      stroke="#C7FF4A"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Fluid 'ohar' cursive connected strokes -->
    <path
      d="M68 88 C74 88, 80 72, 84 72 C88 72, 88 84, 94 82 C98 80, 102 74, 106 74 C110 74, 108 84, 114 80"
      stroke="#C7FF4A"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Dynamic signature underscore flourish -->
    <path
      d="M26 94 Q64 88, 104 96 T118 92"
      stroke="#C7FF4A"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Signature accent dot -->
    <circle cx="106" cy="62" r="3" fill="#C7FF4A"/>
  </g>
</svg>